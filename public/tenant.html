<!DOCTYPE html>
<html>
<head>
  <title>Tenant Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="dashboard">

  <div class="header">
    <h2>Tenant Dashboard</h2>
    <button class="small danger" onclick="logout()">Logout</button>
  </div>

  <!-- INFO CARDS -->
  <div class="cards">
    <div class="card"><h3>Room</h3><p id="room">-</p></div>
    <div class="card"><h3>Rent</h3><p id="rent">-</p></div>
    <div class="card"><h3>Status</h3><p id="status">-</p></div>
  </div>

  <!-- NOTICES -->
  <section class="panel">
    <h3>📢 Notices</h3>
    <ul id="notices" class="list"></ul>
  </section>

  <!-- COMPLAINTS -->
  <section class="panel">
    <h3>🛠 My Complaints</h3>
    <input id="complaintText" placeholder="Describe your issue">
    <button class="small primary" onclick="raiseComplaint()">Submit</button>
    <ul id="complaints" class="list"></ul>
  </section>

</div>

<script type="module" src="/js/tenant.js"></script>
</body>
</html>
