<!DOCTYPE html>
<html>
<head>
  <title>Tenant Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="dashboard">

  <div class="header">
    <h2>Tenant Dashboard</h2>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- CARDS -->
  <div class="cards">
    <div class="card">
      <h3>Room</h3>
      <p id="room">—</p>
    </div>

    <div class="card">
      <h3>Rent</h3>
      <p id="rent">—</p>
    </div>

    <div class="card">
      <h3>Status</h3>
      <p id="status">—</p>
    </div>
  </div>

  <!-- RAISE COMPLAINT -->
  <h3 style="margin-top:30px">Raise Complaint</h3>
  <input id="complaintText" placeholder="Describe issue">
  <button onclick="raiseComplaint()">Submit</button>

  <!-- TENANT COMPLAINTS -->
  <h3 style="margin-top:30px">Your Complaints</h3>
  <ul id="complaints">
    <li class="muted">Loading...</li>
  </ul>

  <!-- NOTICES -->
  <h3 style="margin-top:30px">Notices</h3>
  <ul id="notices">
    <li class="muted">No notices</li>
  </ul>

</div>

<!-- ✅ LOAD ONLY ONCE -->
<script type="module" src="/js/tenant.js"></script>

</body>
</html>
