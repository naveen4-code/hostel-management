<!DOCTYPE html>
<html>
<head>
  <title>Create Account</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">

<div class="auth-card">
  <h2>Create Account</h2>
  <p class="sub">Join your hostel digitally</p>

  <input id="email" type="email" placeholder="Email">
  <<div class="password-wrapper">
  <input
    id="password"
    type="password"
    placeholder="Password (min 6 chars)"
    oninput="checkStrength()"
  >
  <span class="toggle" onclick="togglePassword()">👁</span>
</div>

<div class="strength">
  <div id="strengthBar"></div>
</div>
<p id="strengthText" class="strength-text"></p>

  <button class="full" onclick="signup()">Create Account</button>

  <p class="switch">
    Already have an account?
    <span onclick="openLoginModal()">Login</span>
  </p>
</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal">
  <div class="modal-card">
    <h3>Login</h3>

    <input id="loginEmail" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">

    <button class="full" onclick="loginFromModal()">Login</button>
    <button class="text" onclick="closeLoginModal()">Cancel</button>
  </div>
</div>

<script type="module" src="/js/signup.js"></script>
</body>
</html>
