<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="dashboard">

  <div class="header">
    <h2>Admin Dashboard</h2>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- DASHBOARD CARDS -->
  <div class="cards">
    <div class="card">
      <h3>Total Tenants</h3>
      <p id="tenants">0</p>
    </div>
    <div class="card">
      <h3>Rents Paid</h3>
      <p id="paidRents">0</p>
    </div>
    <div class="card">
      <h3>Pending Complaints</h3>
      <p id="complaints">0</p>
    </div>
  </div>

  <!-- ASSIGN ROOM -->
  <h3>Assign Room</h3>
  <select id="tenantSelect"></select>
  <input id="roomNo" placeholder="Room Number">
  <button onclick="assignRoom()">Assign</button>

  <!-- UPDATE RENT -->
  <h3 style="margin-top:30px">Update Rent Payment</h3>
  <select id="rentTenantSelect"></select>
  <select id="rentStatus">
    <option value="true">Paid</option>
    <option value="false">Pending</option>
  </select>
  <button onclick="updateRent()">Update</button>

  <!-- COMPLAINTS -->
  <h3 style="margin-top:30px">Complaints</h3>
  <ul id="complaintList"></ul>

</div>

<script type="module" src="/js/admin.js"></script>
</body>
</html>
