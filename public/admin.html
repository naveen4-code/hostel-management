<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/style.css" />
</head>

<body class="dashboard-page">

<div class="dashboard">

  <!-- HEADER -->
  <div class="header">
    <h2>🏢 Hostel Admin</h2>
    <button class="small danger" onclick="logout()">Logout</button>
  </div>

  <!-- STATS -->
  <div class="cards">
    <div class="card">
      <h3>Total Tenants</h3>
      <p id="tenants">0</p>
    </div>

    <div class="card">
      <h3>Rents Paid</h3>
      <p id="paidRents">0</p>
    </div>

    <div class="card">
      <h3>Pending Complaints</h3>
      <p id="complaints">0</p>
    </div>
  </div>

  <!-- ASSIGN ROOM -->
  <section class="panel">
    <h3>🛏 Assign Room</h3>

    <select id="tenantSelect">
      <option value="">Loading tenants...</option>
    </select>

    <input
      id="roomNo"
      placeholder="Room Number (e.g. 101)"
    />

    <button class="small primary" onclick="assignRoom()">
      Assign Room
    </button>
  </section>

  <!-- UPDATE RENT -->
  <section class="panel">
    <h3>💰 Update Rent</h3>

    <select id="rentTenantSelect">
      <option value="">Select Tenant</option>
    </select>

    <input
      id="rentAmount"
      type="number"
      placeholder="Monthly Rent (₹)"
    />

    <select id="rentStatus">
      <option value="false">Pending</option>
      <option value="true">Paid</option>
    </select>

    <button class="small primary" onclick="updateRent()">
      Update Rent
    </button>
  </section>

  <!-- COMPLAINTS -->
  <section class="panel">
    <h3>🛠 Complaints</h3>

    <ul id="complaintList" class="list">
      <li class="muted">No complaints</li>
    </ul>
  </section>

</div>

<script type="module" src="/js/admin.js"></script>

</body>
</html>
